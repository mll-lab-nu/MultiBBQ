[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=22.5"]
build-backend = "hatchling.build"

[project]
name = "multibbq"
version = "0.1.0"
description = "MultiBBQ: a fairness evaluation benchmark for multimodal LLMs."
# README is rendered for PyPI by hatch-fancy-pypi-readme (relative links -> GitHub).
dynamic = ["readme"]
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MultiBBQ authors" }]
keywords = ["fairness", "bias", "benchmark", "multimodal", "mllm", "vlm", "llm", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Model backends (torch, transformers, model-specific libs) are heavy and
# hardware-dependent; install them via `conda env create -f environment.yml`.
# The core install covers the CLI and the metric pipeline.
dependencies = [
    "tqdm",
    "pandas>=1.5",
]

[project.urls]
Homepage = "https://multibbq.github.io"
Repository = "https://github.com/mll-lab-nu/MultiBBQ"
Dataset = "https://huggingface.co/datasets/MLL-Lab/MultiBBQ"

[project.optional-dependencies]
# `multibbq download` and building / pushing the HuggingFace dataset.
# huggingface_hub >= 0.23: local_dir downloads write files in place (no duplicate
# blobs under ~/.cache); pyarrow: read image bytes straight out of the parquet.
hf = ["datasets>=2.14", "huggingface_hub>=0.23", "pillow", "pyarrow"]
# API models: GPT-4o / GPT-5 (OpenAI), Gemini (Vertex AI), OpenRouter models.
api = ["openai>=1.102", "google-genai>=1.32", "pillow"]
# Open-source models run locally (versions as in environment.yml, Linux + CUDA GPU).
# Not covered: flash-attn (build against the installed torch) and DeepSeek-VL (GitHub only).
models = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=4.55.4,<5",
    "accelerate>=1.10",
    "qwen-vl-utils>=0.0.11",
    "timm>=1.0.19",
    "einops>=0.8",
    "sentencepiece>=0.2",
    "pillow",
]
# Quantization study (`--experiment quant`).
quant = ["autoawq>=0.2.9", "bitsandbytes>=0.47"]
all = ["multibbq[hf,api,models,quant]"]

[project.scripts]
multibbq = "multibbq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["multibbq"]

# Bundle the evaluation records and the blank canvas, so `multibbq run` works from a
# pip install (images still come from `multibbq download`).
[tool.hatch.build.targets.wheel.force-include]
"data/metadata" = "multibbq/_data/metadata"
"data/images/pure_white_1024_1024.png" = "multibbq/_data/images/pure_white_1024_1024.png"

[tool.hatch.build.targets.sdist]
include = [
    "multibbq",
    "data/metadata",
    "data/images/pure_white_1024_1024.png",
    "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml",
]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images: relative src -> raw GitHub URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/mll-lab-nu/MultiBBQ/main/\1"'

# Links: relative markdown / html links -> GitHub blob URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/mll-lab-nu/MultiBBQ/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/mll-lab-nu/MultiBBQ/blob/main/\1"'
